name: Build and release PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: pdf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Render PDF
        # flake.lock pins Quarto, R, TeX Live, packages, and fonts together.
        # The committed _freeze results remain the source of truth for CI.
        run: nix develop --command quarto render --to pdf

      - name: Package PDF
        run: |
          mkdir -p dist
          find _book -maxdepth 1 -type f -name '*.pdf' -exec cp '{}' dist/ims-zh.pdf \;
          test -s dist/ims-zh.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ims-zh
          path: dist/ims-zh.pdf

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/ims-zh.pdf
          generate_release_notes: true
