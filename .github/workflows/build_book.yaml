name: Build and release PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: pdf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_LIBS_USER: ${{ github.workspace }}/.r-lib
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache TinyTeX
        uses: actions/cache@v4
        with:
          path: ~/.TinyTeX
          key: ${{ runner.os }}-tinytex-quarto-1.4.553-${{ hashFiles('.github/workflows/build_book.yaml') }}
          restore-keys: |
            ${{ runner.os }}-tinytex-quarto-1.4.553-

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
          version: 1.4.553

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: .r-lib
          key: ${{ runner.os }}-r-${{ hashFiles('DESCRIPTION', '_common.R', '.github/workflows/build_book.yaml') }}
          restore-keys: |
            ${{ runner.os }}-r-

      - name: Install required R packages
        run: |
          Rscript -e 'install.packages(c("remotes", "rmarkdown", "ragg"), repos = Sys.getenv("RSPM"))'
          Rscript -e 'remotes::install_deps(dependencies = c("Depends", "Imports", "Suggests"), upgrade = "never")'

      - name: Install plot fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Chinese TeX support
        run: |
          tlmgr="$HOME/.TinyTeX/bin/x86_64-linux/tlmgr"
          "$tlmgr" option repository https://mirrors.tuna.tsinghua.edu.cn/CTAN/systems/texlive/tlnet
          "$tlmgr" update --self
          "$tlmgr" install collection-langchinese fontsetup newcomputermodern selnolig tabularray underscore

      - name: Render PDF
        # The committed _freeze results are the source of truth for CI.  Using
        # `auto` reuses matching results and only executes changed or missing
        # computations; the R/TinyTeX toolchain above handles those cases.
        run: quarto render --to pdf

      - name: Package PDF
        run: |
          mkdir -p dist
          find _book -maxdepth 1 -type f -name '*.pdf' -exec cp '{}' dist/ims-zh.pdf \;
          test -s dist/ims-zh.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ims-zh
          path: dist/ims-zh.pdf

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/ims-zh.pdf
          generate_release_notes: true
