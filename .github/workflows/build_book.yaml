name: Build and release PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: pdf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
          version: 1.4.553

      - name: Install plot fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Chinese TeX support
        run: |
          tlmgr="$HOME/.TinyTeX/bin/x86_64-linux/tlmgr"
          "$tlmgr" option repository https://mirrors.tuna.tsinghua.edu.cn/CTAN/systems/texlive/tlnet
          "$tlmgr" update --self
          "$tlmgr" install collection-langchinese fontsetup newcomputermodern selnolig tabularray underscore

      - name: Render PDF
        # The committed _freeze results are the source of truth for CI.  Using
        # `auto` here would re-execute every changed QMD and require the full
        # R dependency stack merely to typeset the already-frozen results.
        run: quarto render --to pdf --use-freezer

      - name: Package PDF
        run: |
          mkdir -p dist
          find _book -maxdepth 1 -type f -name '*.pdf' -exec cp '{}' dist/ims-zh.pdf \;
          test -s dist/ims-zh.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ims-zh
          path: dist/ims-zh.pdf

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/ims-zh.pdf
          generate_release_notes: true
